# Local development, loaded automatically by `docker compose` (not when -f is given):
# build the app image from source and publish ports on 127.0.0.1 only, in the 28xxx-29xxx range.
x-build: &build
  build:
    context: .
x-build-orchestration: &build-orchestration
  build:
    context: .
    target: orchestration

services:
  storage:
    ports:
      - "127.0.0.1:29000:9000" # S3 API
      - "127.0.0.1:29001:9001" # RustFS web console
  catalog:
    ports:
      - "127.0.0.1:28181:8181" # Iceberg REST catalog and management API
  broker:
    ports:
      - "127.0.0.1:29092:19092" # Kafka API (external listener, SASL/SCRAM); the admin API stays inside
  catalog-init: *build
  doctor: *build
  ingest: *build
  stream-producer: *build
  stream-consumer: *build
  orchestration-migrate: *build-orchestration
  dagster-code: *build-orchestration
  dagster-daemon: *build-orchestration
  dagster-webserver:
    <<: *build-orchestration
    ports:
      - "127.0.0.1:28300:3000" # Dagster UI and GraphQL API
    # Its other networks are internal, and Docker publishes no port through an internal network.
    networks: [orchestration-ui]

networks:
  orchestration-ui:
