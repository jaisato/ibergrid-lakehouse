# IberGrid Lakehouse: one container per service, environment-agnostic base.
#   Local:      docker compose --profile local-storage up -d --wait --build   (make up)
#               compose.override.yaml is loaded automatically: build from source, 127.0.0.1 ports.
#   Production: docker compose -f compose.yaml -f compose.prod.yaml up -d --wait
#               Object storage is Cloudflare R2, so the local-storage profile stays off.
#   Stream:     the stream-producer and stream-consumer services are in the `stream` profile locally
#               (make stream-up), so a local stack never calls REData on its own; production
#               runs them.
# Secrets come from .env (make env) with no defaults: compose refuses to start without them.
name: ibergrid

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env (make env)}@catalog-db:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env (make env)}@catalog-db:5432/lakekeeper
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set LAKEKEEPER_ENCRYPTION_KEY in .env (make env)}
  # No LAKEKEEPER__BASE_URI: Lakekeeper then derives the catalog URI it advertises from each
  # request's Host header, so host clients get 127.0.0.1:28181 and containers get catalog:8181.
  RUST_LOG: info

# What ibergrid's code reads, in the app's one-shots and in dagster-code's runs. Same variable
# names as ibergrid.settings.
x-app-env: &app-env
  IBERGRID_S3_ENDPOINT_URL: ${IBERGRID_S3_ENDPOINT_URL:-http://storage:9000}
  IBERGRID_S3_REGION: ${IBERGRID_S3_REGION:-us-east-1}
  IBERGRID_S3_BUCKET: ${IBERGRID_S3_BUCKET:-ibergrid}
  IBERGRID_S3_ACCESS_KEY: ${IBERGRID_S3_ACCESS_KEY:?set IBERGRID_S3_ACCESS_KEY in .env (make env)}
  IBERGRID_S3_SECRET_KEY: ${IBERGRID_S3_SECRET_KEY:?set IBERGRID_S3_SECRET_KEY in .env (make env)}
  IBERGRID_CATALOG_URL: http://catalog:8181
  IBERGRID_CATALOG_WAREHOUSE: ${IBERGRID_CATALOG_WAREHOUSE:-lakehouse}
  IBERGRID_BROKER_BOOTSTRAP_SERVERS: broker:9092
  IBERGRID_REDATA_BASE_URL: ${IBERGRID_REDATA_BASE_URL:-https://apidatos.ree.es}
  IBERGRID_REDATA_TIMEOUT: ${IBERGRID_REDATA_TIMEOUT:-60}
  IBERGRID_REDATA_MAX_RPS: ${IBERGRID_REDATA_MAX_RPS:-1}
  IBERGRID_OMIE_BASE_URL: ${IBERGRID_OMIE_BASE_URL:-https://www.omie.es}
  IBERGRID_OMIE_TIMEOUT: ${IBERGRID_OMIE_TIMEOUT:-30}
  IBERGRID_OMIE_MAX_RPS: ${IBERGRID_OMIE_MAX_RPS:-1}
  IBERGRID_TRANSFORM_THREADS: ${IBERGRID_TRANSFORM_THREADS:-1}
  IBERGRID_MAINTENANCE_SNAPSHOT_RETENTION_DAYS: ${IBERGRID_MAINTENANCE_SNAPSHOT_RETENTION_DAYS:-7}
  IBERGRID_MAINTENANCE_RETAIN_LAST_SNAPSHOTS: ${IBERGRID_MAINTENANCE_RETAIN_LAST_SNAPSHOTS:-5}
  IBERGRID_MAINTENANCE_ORPHAN_GRACE_HOURS: ${IBERGRID_MAINTENANCE_ORPHAN_GRACE_HOURS:-48}
  IBERGRID_LINEAGE_NAMESPACE: ${IBERGRID_LINEAGE_NAMESPACE:-ibergrid}
  IBERGRID_LINEAGE_ENDPOINT_URL: ${IBERGRID_LINEAGE_ENDPOINT_URL:-}
  IBERGRID_LINEAGE_SINK_PATH: ${IBERGRID_LINEAGE_SINK_PATH:-}
  IBERGRID_LOG_LEVEL: ${IBERGRID_LOG_LEVEL:-INFO}
  IBERGRID_LOG_FORMAT: json

# The streaming lane's names (ADR 0006), defined once for broker-init and both stream services.
x-stream-names: &stream-names
  IBERGRID_STREAM_TOPIC: redata.demand.realtime.v1
  IBERGRID_STREAM_DLQ_TOPIC: redata.demand.realtime.dlq.v1
  IBERGRID_STREAM_GROUP_ID: redata-demand-to-bronze

# What the stream services read besides their broker user: cadences, bounds, the watchdog.
x-stream-env: &stream-env
  <<: *stream-names
  IBERGRID_STREAM_POLL_INTERVAL: ${IBERGRID_STREAM_POLL_INTERVAL:-300}
  IBERGRID_STREAM_MIDNIGHT_GRACE: ${IBERGRID_STREAM_MIDNIGHT_GRACE:-7200}
  IBERGRID_STREAM_FLUSH_RECORDS: ${IBERGRID_STREAM_FLUSH_RECORDS:-10000}
  IBERGRID_STREAM_FLUSH_AGE: ${IBERGRID_STREAM_FLUSH_AGE:-60}
  IBERGRID_STREAM_CHECKPOINT_INTERVAL: ${IBERGRID_STREAM_CHECKPOINT_INTERVAL:-900}
  IBERGRID_STREAM_DEDUP_DAYS: ${IBERGRID_STREAM_DEDUP_DAYS:-3}
  IBERGRID_STREAM_STALE_BRANCH_AGE: ${IBERGRID_STREAM_STALE_BRANCH_AGE:-900}
  IBERGRID_STREAM_SNAPSHOT_RETENTION_DAYS: ${IBERGRID_STREAM_SNAPSHOT_RETENTION_DAYS:-3}
  IBERGRID_STREAM_WATCHDOG_TIMEOUT: ${IBERGRID_STREAM_WATCHDOG_TIMEOUT:-900}

# The ibergrid app image (catalog-init, doctor, ingest, stream-producer, stream-consumer).
x-app: &app
  <<: *hardened
  image: ibergrid-app:local
  restart: "no"
  mem_limit: 192m
  environment: *app-env

# The orchestration image (ADR 0005): the app plus Dagster and its instance configuration.
x-orchestration: &orchestration
  <<: *hardened
  image: ibergrid-orchestration:local
  restart: on-failure
  user: "10001:10001"

services:
  # --- Object storage (local only; production uses Cloudflare R2) --------------------------------
  storage:
    <<: *hardened
    profiles: [local-storage]
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: on-failure
    mem_limit: 512m
    environment:
      RUSTFS_ACCESS_KEY: ${IBERGRID_S3_ACCESS_KEY:?set IBERGRID_S3_ACCESS_KEY in .env (make env)}
      RUSTFS_SECRET_KEY: ${IBERGRID_S3_SECRET_KEY:?set IBERGRID_S3_SECRET_KEY in .env (make env)}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage-data:/data
    networks: [storage]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: create the bucket unless it exists (RustFS answers create-bucket with 200 either way).
  storage-init:
    <<: *hardened
    profiles: [local-storage]
    image: amazon/aws-cli:2.41.2@sha256:7a77ccb39e3272191adbf905c50db8c127db88fd79454911a41a6b1c0e419e9b
    user: "65534:65534"
    restart: "no"
    mem_limit: 256m
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${IBERGRID_S3_ACCESS_KEY:?set IBERGRID_S3_ACCESS_KEY in .env (make env)}
      AWS_SECRET_ACCESS_KEY: ${IBERGRID_S3_SECRET_KEY:?set IBERGRID_S3_SECRET_KEY in .env (make env)}
      AWS_DEFAULT_REGION: ${IBERGRID_S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://storage:9000
      BUCKET: ${IBERGRID_S3_BUCKET:-ibergrid}
      HOME: /tmp
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null; then
          echo "bucket $$BUCKET already exists"
        else
          aws s3api create-bucket --bucket "$$BUCKET" > /dev/null
          echo "created bucket $$BUCKET"
        fi
    networks: [storage]

  # --- Catalog: Lakekeeper (Iceberg REST) on Postgres --------------------------------------------
  catalog-db:
    <<: *hardened
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    # The image's postgres user (uid 70) owns the data directory, so no capability is needed.
    user: postgres
    restart: on-failure
    mem_limit: 256m
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_DB: lakekeeper
      POSTGRES_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:?set LAKEKEEPER_DB_PASSWORD in .env (make env)}
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks: [catalog-db]
    healthcheck:
      # Over TCP: during the first start the entrypoint runs a socket-only server for initdb.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lakekeeper", "-d", "lakekeeper"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: apply Lakekeeper's schema migrations.
  catalog-migrate:
    <<: *hardened
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    # The image declares no USER (it would run as root); 65532 is distroless's "nonroot".
    user: "65532:65532"
    command: ["migrate"]
    restart: "no"
    mem_limit: 256m
    environment: *lakekeeper-env
    depends_on:
      catalog-db:
        condition: service_healthy
    networks: [catalog-db]

  catalog:
    <<: *hardened
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    user: "65532:65532"
    command: ["serve"]
    restart: on-failure
    mem_limit: 256m
    environment: *lakekeeper-env
    depends_on:
      catalog-db:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
    # catalog-db for its state, catalog for clients, storage to validate and reach the warehouse.
    networks: [catalog-db, catalog, storage]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: bootstrap Lakekeeper and create the warehouse (idempotent).
  catalog-init:
    <<: *app
    command: ["catalog", "bootstrap"]
    depends_on:
      catalog:
        condition: service_healthy
      # Only when the local-storage profile is on; in production the bucket already exists in R2.
      storage-init:
        condition: service_completed_successfully
        required: false
    networks: [catalog]

  # --- Broker: Redpanda (Kafka API), single node (ADR 0006) ---------------------------------------
  # Dev-container mode locally (fsync bypassed, startup checks off); compose.prod.yaml runs it in
  # production mode. broker-init turns SASL/SCRAM and ACLs on in both, so clients authenticate in
  # every environment; the admin API (9644) is published nowhere. The image's configuration also
  # starts the HTTP Proxy (8082) and the Schema Registry (8081), both without authentication and
  # unused here: the entrypoint deletes their sections first, so neither listens.
  broker:
    <<: *hardened
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
    restart: on-failure
    mem_limit: 1536m
    entrypoint:
      ["/bin/bash", "-c", "sed -i '/^pandaproxy:/d; /^schema_registry:/d' /etc/redpanda/redpanda.yaml && exec /entrypoint.sh \"$$@\"", "broker"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --overprovisioned
      # internal for containers; external is only reachable where compose.override.yaml publishes it.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://broker:9092,external://127.0.0.1:29092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=broker:33145
    volumes:
      - broker-data:/var/lib/redpanda/data
    networks: [broker]
    healthcheck:
      # The health overview answers without authentication, also once broker-init requires it.
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot, idempotent: the SCRAM users, authentication on the Kafka and admin APIs, the topics
  # and the ACLs (ADR 0006). The superuser exists for this job only; each service gets its own
  # least-privilege user. On a new cluster the admin API needs no authentication until step 2
  # requires it, so the first run creates the superuser anonymously and every later run
  # authenticates as it. A user whose password changed in .env gets it here (rotation); the
  # superuser's own password cannot rotate this way (ADR 0006). No password is ever on a command
  # line: rpk reads its credentials from RPK_*, and the users are created through the admin API
  # by curl, from files that bash's printf (a builtin, so no process) writes and the job deletes.
  broker-init:
    <<: *hardened
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
    restart: "no"
    mem_limit: 256m
    depends_on:
      broker:
        condition: service_healthy
    environment:
      <<: *stream-names
      RPK_BROKERS: broker:9092
      RPK_ADMIN_HOSTS: broker:9644
      RPK_USER: ibergrid-admin
      RPK_PASS: ${REDPANDA_ADMIN_PASSWORD:?set REDPANDA_ADMIN_PASSWORD in .env (make env)}
      RPK_SASL_MECHANISM: SCRAM-SHA-256
      PRODUCER_PASSWORD: ${REDPANDA_PRODUCER_PASSWORD:?set REDPANDA_PRODUCER_PASSWORD in .env (make env)}
      CONSUMER_PASSWORD: ${REDPANDA_CONSUMER_PASSWORD:?set REDPANDA_CONSUMER_PASSWORD in .env (make env)}
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        umask 077
        netrc=/tmp/broker-init.netrc body=/tmp/broker-init.json answer=/tmp/broker-init.answer
        trap 'rm -f "$$netrc" "$$body" "$$answer"' EXIT
        # The passwords go into a netrc and a JSON body unescaped: make env writes hex.
        for password in "$$RPK_PASS" "$$PRODUCER_PASSWORD" "$$CONSUMER_PASSWORD"; do
          if [[ ! "$$password" =~ ^[A-Za-z0-9._~-]+$$ ]]; then
            echo "a REDPANDA_*_PASSWORD holds characters other than A-Z a-z 0-9 . _ ~ -" >&2
            exit 1
          fi
        done
        printf 'machine broker login %s password %s\n' "$$RPK_USER" "$$RPK_PASS" > "$$netrc"
        # Create a SCRAM user, or set its password when it exists with another (rotation).
        scram_user() {
          printf '{"username":"%s","password":"%s","algorithm":"SCRAM-SHA-256"}' "$$1" "$$2" > "$$body"
          for method in POST PUT; do
            url=http://broker:9644/v1/security/users
            [ "$$method" = PUT ] && url="$$url/$$1"
            status="$$(curl -sS --max-time 30 --netrc-file "$$netrc" -o "$$answer" -w '%{http_code}' \
              -X "$$method" -H 'Content-Type: application/json' --data "@$$body" "$$url")"
            [ "$$status" = 200 ] && return 0
            [ "$$status" = 401 ] && break
          done
          echo "user $$1: HTTP $$status $$(cat "$$answer")" >&2
          if [ "$$status" = 401 ]; then
            echo "REDPANDA_ADMIN_PASSWORD does not open this broker (ADR 0006)" >&2
          fi
          return 1
        }
        # 1. The superuser: on a new cluster the admin API takes it anonymously.
        scram_user "$$RPK_USER" "$$RPK_PASS"
        # 2. Authentication everywhere, then cluster-wide policy: topics only from here, and
        #    durable writes (in production mode; dev-container mode bypasses fsync anyway).
        for setting in "superusers=[\"$$RPK_USER\"]" admin_api_require_auth=true enable_sasl=true \
            auto_create_topics_enabled=false write_caching_default=false; do
          rpk cluster config set "$$setting" > /dev/null
        done
        # 3. One user per service.
        scram_user ibergrid-producer "$$PRODUCER_PASSWORD"
        scram_user ibergrid-consumer "$$CONSUMER_PASSWORD"
        # 4. The topics: key-ordered data in 3 partitions kept 7 days, dead letters 30 days.
        #    Segments roll daily, so retention removes data within a day of its limit (with the
        #    default 14-day segments this volume would stay up to 21 days).
        for spec in "$$IBERGRID_STREAM_TOPIC:3:604800000" "$$IBERGRID_STREAM_DLQ_TOPIC:1:2592000000"; do
          IFS=: read -r topic partitions retention <<< "$$spec"
          if rpk topic describe "$$topic" > /dev/null 2>&1; then
            rpk topic alter-config "$$topic" --set retention.ms="$$retention" \
              --set segment.ms=86400000 --set cleanup.policy=delete > /dev/null
          else
            rpk topic create "$$topic" --partitions "$$partitions" --replicas 1 \
              -c retention.ms="$$retention" -c segment.ms=86400000 -c cleanup.policy=delete > /dev/null
          fi
        done
        # 5. Least privilege: the producer writes the data topic; the consumer reads it, writes
        #    dead letters and commits its group's offsets (lag visibility). Nothing else.
        rpk security acl create --allow-principal User:ibergrid-producer --operation write,describe --topic "$$IBERGRID_STREAM_TOPIC" > /dev/null
        rpk security acl create --allow-principal User:ibergrid-consumer --operation read,describe --topic "$$IBERGRID_STREAM_TOPIC" > /dev/null
        rpk security acl create --allow-principal User:ibergrid-consumer --operation write,describe --topic "$$IBERGRID_STREAM_DLQ_TOPIC" > /dev/null
        rpk security acl create --allow-principal User:ibergrid-consumer --operation read,describe --group "$$IBERGRID_STREAM_GROUP_ID" > /dev/null
        rpk security acl list
    networks: [broker]

  # --- Orchestration: Dagster (ADR 0005) on Postgres ---------------------------------------------
  orchestration-db:
    <<: *hardened
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    user: postgres
    restart: on-failure
    mem_limit: 256m
    environment:
      POSTGRES_USER: dagster
      POSTGRES_DB: dagster
      POSTGRES_PASSWORD: ${DAGSTER_DB_PASSWORD:?set DAGSTER_DB_PASSWORD in .env (make env)}
    volumes:
      - orchestration-db-data:/var/lib/postgresql/data
    networks: [orchestration-db]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "dagster", "-d", "dagster"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: create or upgrade Dagster's schema, so the services below never race to create it.
  orchestration-migrate:
    <<: *orchestration
    command: ["dagster", "instance", "migrate"]
    restart: "no"
    mem_limit: 256m
    environment:
      DAGSTER_PG_PASSWORD: ${DAGSTER_DB_PASSWORD:?set DAGSTER_DB_PASSWORD in .env (make env)}
    depends_on:
      orchestration-db:
        condition: service_healthy
    networks: [orchestration-db]

  # gRPC code server with ibergrid.orchestration.definitions. The default run launcher runs every
  # run as a subprocess here, so this is the one Dagster service with the lake's keys and egress
  # to the sources (storage and catalog have egress), and its memory limit covers the runs: at
  # most one REData and one OMIE run at a time (pools of 1) plus the sweeper.
  dagster-code:
    <<: *orchestration
    command:
      ["dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000",
       "-m", "ibergrid.orchestration.definitions"]
    mem_limit: 1536m
    # On a stop (a deploy recreates it) the code server waits for its runs to end: Docker's default
    # 10 s would kill them, leaving runs "started" that hold their pool until the runtime limit.
    stop_grace_period: 5m
    environment:
      <<: *app-env
      DAGSTER_PG_PASSWORD: ${DAGSTER_DB_PASSWORD:?set DAGSTER_DB_PASSWORD in .env (make env)}
      # Stopped by default: a local stack never calls the sources on its own.
      IBERGRID_ORCHESTRATION_SCHEDULES_RUNNING: ${IBERGRID_ORCHESTRATION_SCHEDULES_RUNNING:-false}
    volumes:
      - orchestration-compute-logs:/opt/dagster/compute-logs
    depends_on:
      orchestration-migrate:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    networks: [orchestration, orchestration-db, storage, catalog]
    # Each check starts a Python process (about 1 s of CPU): every minute, every 5 s while starting.
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s

  # The UI and GraphQL API. No host port in production; locally 127.0.0.1:28300.
  dagster-webserver:
    <<: *orchestration
    command:
      ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000",
       "-w", "/opt/dagster/home/workspace.yaml"]
    mem_limit: 768m
    environment:
      DAGSTER_PG_PASSWORD: ${DAGSTER_DB_PASSWORD:?set DAGSTER_DB_PASSWORD in .env (make env)}
    volumes:
      - orchestration-compute-logs:/opt/dagster/compute-logs:ro
    depends_on:
      dagster-code:
        condition: service_healthy
    networks: [orchestration, orchestration-db]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=3)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s

  # Schedules, backfills, the run queue with its pools, and run monitoring.
  dagster-daemon:
    <<: *orchestration
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    mem_limit: 512m
    environment:
      DAGSTER_PG_PASSWORD: ${DAGSTER_DB_PASSWORD:?set DAGSTER_DB_PASSWORD in .env (make env)}
    depends_on:
      dagster-code:
        condition: service_healthy
    networks: [orchestration, orchestration-db]
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
      start_interval: 5s

  # --- Tools -------------------------------------------------------------------------------------
  # Readiness report from inside the network: `docker compose run --rm --no-deps doctor` (make smoke
  # and the deploy job); with arguments it runs other ibergrid commands, such as `lake init`.
  # scale 0: `up` never starts it. Its depends_on also matters to `up --wait`, which treats a
  # one-shot that nothing depends on as failed once it exits; with a dependent, compose waits for
  # catalog-init to complete successfully instead.
  doctor:
    <<: *app
    scale: 0
    command: ["doctor"]
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      broker-init:
        condition: service_completed_successfully
    networks: [storage, catalog, broker]

  # Ingestion, on demand: `docker compose run --rm --no-deps ingest redata --dataset ...` or
  # `... ingest omie --start ... --end ...`. REData and OMIE are on the public internet (these
  # networks have egress). A month of five-minute demand (35,760 rows) peaks at 238 MiB of cgroup
  # memory (ADR 0003), hence its own limit.
  ingest:
    <<: *app
    scale: 0
    mem_limit: 384m
    entrypoint: ["ibergrid", "ingest"]
    command: ["--help"]
    networks: [storage, catalog]

  # Medallion transforms, on demand: `docker compose run --rm --no-deps transform run` (make
  # transform). Runs from the orchestration image, which carries dbt-core, dbt-duckdb and dbt/.
  transform:
    <<: *orchestration
    scale: 0
    restart: "no"
    mem_limit: 1280m
    entrypoint: ["ibergrid", "transform"]
    command: ["--help"]
    environment: *app-env
    networks: [storage, catalog]

  # Quality gates and maintenance, on demand: `docker compose run --rm --no-deps quality check`
  # (make quality-check). Runs from the orchestration image, which carries soda-core, soda-duckdb
  # and /opt/ibergrid/contracts/soda (ADR 0008).
  quality:
    <<: *orchestration
    scale: 0
    restart: "no"
    mem_limit: 1024m
    entrypoint: ["ibergrid", "quality"]
    command: ["--help"]
    environment: *app-env
    networks: [storage, catalog]

  # --- Streaming lane (ADR 0006) -----------------------------------------------------------------
  # REData's five-minute national demand into redata.demand.realtime.v1. The broker's network has
  # egress for REData; no storage or catalog keys, no other network.
  stream-producer:
    <<: *app
    profiles: [stream]
    restart: on-failure
    mem_limit: 256m
    command: ["stream", "produce"]
    environment:
      IBERGRID_BROKER_BOOTSTRAP_SERVERS: broker:9092
      IBERGRID_BROKER_USERNAME: ibergrid-producer
      IBERGRID_BROKER_PASSWORD: ${REDPANDA_PRODUCER_PASSWORD:?set REDPANDA_PRODUCER_PASSWORD in .env (make env)}
      IBERGRID_REDATA_BASE_URL: ${IBERGRID_REDATA_BASE_URL:-https://apidatos.ree.es}
      IBERGRID_REDATA_TIMEOUT: ${IBERGRID_REDATA_TIMEOUT:-60}
      IBERGRID_REDATA_MAX_RPS: ${IBERGRID_REDATA_MAX_RPS:-1}
      IBERGRID_LOG_LEVEL: ${IBERGRID_LOG_LEVEL:-INFO}
      IBERGRID_LOG_FORMAT: json
      <<: *stream-env
    depends_on:
      broker-init:
        condition: service_completed_successfully
    networks: [broker]
    # The heartbeat module, not the CLI: the check runs in this container's memory limit. A poll
    # can take four REData attempts of up to 60 s each, hence the producer's longer limit; failing
    # polls (REData or the broker) for 15 minutes make it unhealthy.
    healthcheck:
      test: ["CMD", "python", "-m", "ibergrid.stream.health", "--max-age", "330", "--max-failing", "900"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # The topic into bronze.redata_demand_stream: WAP micro-batches whose publish commits the
  # checkpoint. On SIGTERM it flushes what it buffered, hence the grace period.
  stream-consumer:
    <<: *app
    profiles: [stream]
    restart: on-failure
    mem_limit: 384m
    stop_grace_period: 60s
    command: ["stream", "consume"]
    environment:
      <<: [*app-env, *stream-env]
      IBERGRID_BROKER_USERNAME: ibergrid-consumer
      IBERGRID_BROKER_PASSWORD: ${REDPANDA_CONSUMER_PASSWORD:?set REDPANDA_CONSUMER_PASSWORD in .env (make env)}
    depends_on:
      broker-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    networks: [broker, catalog, storage]
    # Unhealthy at once when it refuses to start (a topic changed under its checkpoint), and after
    # 10 minutes of failing iterations: the catalog, refused dead letters, or a broker that a probe
    # every minute finds unreachable or refusing the password. A loop stuck for
    # IBERGRID_STREAM_WATCHDOG_TIMEOUT ends the process, and the restart policy recovers it.
    healthcheck:
      test: ["CMD", "python", "-m", "ibergrid.stream.health", "--max-age", "120", "--max-failing", "600"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 5s

  # --- Serving: FastAPI + DuckDB API & static portal (ADR 0010) ----------------------------------
  # Read-only real-time serving layer over Iceberg tables plus mounted static portal at /portal.
  # Joins storage, catalog and public-edge (never broker, catalog-db or orchestration networks).
  api:
    <<: *hardened
    image: ibergrid-api:local
    restart: on-failure
    user: "10001:10001"
    mem_limit: 512m
    environment:
      <<: *app-env
      IBERGRID_API_HOST: "0.0.0.0"
      IBERGRID_API_PORT: "8000"
      IBERGRID_API_RATE_LIMIT_RPM: ${IBERGRID_API_RATE_LIMIT_RPM:-60}
      IBERGRID_API_CORS_ORIGINS: ${IBERGRID_API_CORS_ORIGINS:-http://127.0.0.1:28000,http://localhost:28000}
      IBERGRID_API_CACHE_TTL_SECONDS: ${IBERGRID_API_CACHE_TTL_SECONDS:-60}
      IBERGRID_API_TRUST_PROXY_HEADERS: ${IBERGRID_API_TRUST_PROXY_HEADERS:-false}
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks: [storage, catalog, public-edge]
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s

networks:
  storage:
  catalog:
  broker:
  # Public ingress boundary (ADR 0010): only Caddy (in compose.prod.yaml) and `api` join this
  # network, isolating storage, catalog, broker, Postgres and Dagster from the public edge.
  public-edge:
  # Postgres needs no egress: only Lakekeeper talks to it.
  catalog-db:
    internal: true
  # Dagster's services among themselves (gRPC to dagster-code) and to their Postgres: no egress.
  orchestration:
    internal: true
  orchestration-db:
    internal: true

volumes:
  storage-data:
  catalog-db-data:
  broker-data:
  orchestration-db-data:
  orchestration-compute-logs:
