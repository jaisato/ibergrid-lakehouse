# Dagster instance (ADR 0005), baked into the orchestration image as $DAGSTER_HOME/dagster.yaml and
# shared by dagster-code (which runs the runs), dagster-webserver and dagster-daemon.

# Runs, event logs (materializations and their metadata), schedules and their ticks: Postgres,
# the orchestration-db service. The orchestration-migrate one-shot (`dagster instance migrate`)
# creates or upgrades the schema before the services start, so they never race to create it.
storage:
  postgres:
    postgres_db:
      hostname: orchestration-db
      port: 5432
      db_name: dagster
      username: dagster
      password:
        env: DAGSTER_PG_PASSWORD

# The daemon dequeues runs. Every pool (REData, OMIE) has a limit of 1, checked per run, before it
# is launched: one writer per table and one request a second per source (ADR 0003, ADR 0004).
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
concurrency:
  pools:
    default_limit: 1
    granularity: run
  runs:
    max_concurrent_runs: 3

# Runs execute as subprocesses of the code server that holds the code (dagster-code): no Docker
# socket anywhere. The run worker shares that container's memory limit.
run_launcher:
  module: dagster._core.launcher
  class: DefaultRunLauncher

# The default launcher cannot report a dead run worker. A run whose worker was killed (dagster-code
# stopped beyond its 5-minute grace period, an out-of-memory kill) stays "started", holding its
# pool, until the runtime limit cancels it; the sweeper then frees its audit branches. 2 hours is
# 4 times the full backfill (30 minutes); a longer run sets the dagster/max_runtime_seconds tag.
run_monitoring:
  enabled: true
  start_timeout_seconds: 180
  cancel_timeout_seconds: 180
  max_runtime_seconds: 7200

# A run that fails without a failed step (one that never started, for example) is queued again,
# up to twice. Failed steps are retried by the scheduled jobs' own policy, 15 minutes apart
# (ibergrid.orchestration.definitions); backfills are not, since a retry redoes the whole range.
run_retries:
  enabled: true
  max_retries: 2
  retry_on_asset_or_op_failure: false

# Written by the run workers in dagster-code, read by the webserver: one shared volume.
compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/compute-logs

telemetry:
  enabled: false
